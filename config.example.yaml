# Copy to config.yaml and fill in. Any scalar can be overridden with TGIRA_* env vars.
token: ""                 # TGIRA_TOKEN, from @BotFather
db_path: ./tgira.db       # TGIRA_DB_PATH
locale: en                # TGIRA_LOCALE: en | ru
log_level: info           # TGIRA_LOG_LEVEL: debug | info | warn | error

# Every board is one forum topic the bot watches.
# Run /whereami in the topic to learn chat_id and thread_id.
boards:
  - code: TG
    title: Tasks
    chat_id: -1001234567890
    thread_id: 42

parse:
  # edges:    a lone 1/2/3 is a priority only as the first or last token
  # anywhere: a lone 1/2/3 anywhere in the first line is a priority
  priority_position: edges

ui:
  buttons: true
  pin_board: true
  ephemeral_ttl_seconds: 60
  board_debounce_ms: 2000
