name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: test
        run: go test ./...

      - name: build
        run: make release VERSION=${GITHUB_REF_NAME}

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
